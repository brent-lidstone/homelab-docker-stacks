services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "${PORT}:8080"
    volumes:
      - ${DATA_DIR}:/app/backend/data
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    restart: unless-stopped
