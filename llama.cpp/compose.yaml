services:
  llama:
    build:
      context: https://github.com/ggml-org/llama.cpp.git
      dockerfile: .devops/cuda.Dockerfile
      target: server
      # 12.4.1 is needed to run on the GTX 1070 using driver 550
      args:
        CUDA_VERSION: "12.4.1"
        UBUNTU_VERSION: "22.04"
        GCC_VERSION: "12"
    container_name: llama-cpp
    restart: unless-stopped
    ports:
      - "${PORT}:8080"
    environment:
      LLAMA_ARG_HOST: "0.0.0.0"
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_MODELS_DIR: "/models"
      LLAMA_ARG_MODELS_PRESET: "/config/models.ini"
      LLAMA_ARG_MODELS_MAX: "${MODELS_MAX}"
      LLAMA_ARG_LOG_VERBOSITY: "${LOG_VERBOSITY}"
    volumes:
      - ${DATA_DIR}:/models
      - ./models.ini:/config/models.ini:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]